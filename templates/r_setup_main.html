<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pie AI • Set Up Your Restaurant</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    :root {
      --gold:        #c9a84c;
      --gold-light:  #e8cc7a;
      --gold-dim:    rgba(201,168,76,0.12);
      --gold-border: rgba(201,168,76,0.22);
      --ink:         #0c0c0a;
      --surface:     #111108;
      --surface2:    #161612;
      --text:        #f0ead8;
      --text-dim:    rgba(240,234,216,0.45);
      --text-mid:    rgba(240,234,216,0.7);
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================================
       HEADER
    ================================ */
    .header {
      width: 100%;
      height: 130px;
      background-image: url('/static/images/italy_house.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.58);
    }

    .header-rule {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 0.5px;
      background: linear-gradient(to right, transparent, var(--gold-border), transparent);
    }

    .back-button {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75em;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      background: rgba(12,12,10,0.72);
      backdrop-filter: blur(12px);
      border: 0.5px solid var(--gold-border);
      border-radius: 2px;
      transition: background 0.2s;
    }

    .back-button:hover { background: var(--gold-dim); }

    .header-title {
      position: relative;
      z-index: 2;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4em;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(201,168,76,0.2);
    }

    /* ================================
       PROGRESS BAR
    ================================ */
    .progress-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 32px 20px 0;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75em;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 500;
    }

    .step.active { color: var(--gold); }
    .step.done   { color: #2ecc71; }

    .step-dot {
      width: 28px;
      height: 28px;
      border: 0.5px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78em;
      font-weight: 500;
      flex-shrink: 0;
    }

    .step.active .step-dot {
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 12px rgba(201,168,76,0.2);
    }

    .step.done .step-dot {
      border-color: #2ecc71;
      background: rgba(46,204,113,0.1);
      color: #2ecc71;
    }

    .step-line {
      width: 60px;
      height: 0.5px;
      background: var(--gold-border);
      margin: 0 12px;
    }

    /* ================================
       PAGE SHELL
    ================================ */
    .page-shell {
      max-width: 700px;
      margin: 36px auto 80px;
      width: calc(100% - 48px);
      background: rgba(10,10,8,0.85);
      border: 0.5px solid var(--gold-border);
      border-radius: 16px;
      padding: 44px 44px 52px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      position: relative;
    }

    .page-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0.4;
      border-radius: 16px 16px 0 0;
    }

    /* ================================
       PAGE TITLE
    ================================ */
    .page-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 0.5px solid var(--gold-border);
    }

    .page-eyebrow {
      font-size: 0.62em;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4em;
      font-weight: 400;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 0.83em;
      color: var(--text-dim);
      font-weight: 300;
      line-height: 1.6;
    }

    /* ================================
       FORM
    ================================ */
    form {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.72em;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    input, textarea {
      background: var(--surface);
      border: 0.5px solid rgba(255,255,255,0.07);
      padding: 13px 16px;
      color: var(--text);
      font-size: 0.88em;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      letter-spacing: 0.5px;
      transition: border-color 0.2s;
      width: 100%;
      border-radius: 0;
      outline: none;
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-dim);
    }

    input:focus, textarea:focus {
      border-color: rgba(201,168,76,0.45);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* ================================
       LOGO UPLOAD
    ================================ */
    .logo-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 20px;
      border: 0.5px dashed var(--gold-border);
      background: var(--surface);
      cursor: pointer;
      transition: all 0.25s;
      text-align: center;
    }

    .logo-upload:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(17,17,8,0.9);
    }

    .logo-upload p {
      font-size: 0.82em;
      color: var(--gold);
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .logo-upload small {
      font-size: 0.72em;
      color: var(--text-dim);
    }

    #logoPreview {
      width: 88px;
      height: 88px;
      object-fit: cover;
      display: none;
      border: 0.5px solid var(--gold-border);
      box-shadow: 0 0 20px rgba(201,168,76,0.2);
    }

    /* ================================
       SECTION DIVIDER
    ================================ */
    .section-divider {
      height: 0.5px;
      background: linear-gradient(to right, transparent, var(--gold-border), transparent);
      margin: 4px 0;
    }

    .section-label {
      font-size: 0.62em;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: -8px;
    }

    /* ================================
       TAGS
    ================================ */
    .tags-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .tag-btn {
      padding: 11px 14px;
      border: 0.5px solid rgba(255,255,255,0.07);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 0.82em;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      letter-spacing: 0.5px;
      border-radius: 0;
    }

    .tag-btn:hover {
      border-color: var(--gold-border);
      color: var(--text-mid);
    }

    .tag-btn.active {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
      font-weight: 500;
    }

    /* ================================
       CONTINUE BUTTON
    ================================ */
    .continue-btn {
      margin-top: 8px;
      background: var(--gold);
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82em;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 16px;
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .continue-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.1);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .continue-btn:hover::before { transform: scaleX(1); }
    .continue-btn:hover { background: var(--gold-light); }

    /* ================================
       MOBILE
    ================================ */
    @media (max-width: 600px) {
      .page-shell { padding: 28px 20px 36px; width: calc(100% - 24px); margin: 24px auto 60px; }
      .tags-grid  { grid-template-columns: 1fr; }
      .header-title { font-size: 1.8em; }
      .step-line { width: 32px; }
    }

  </style>
</head>
<body>

<!-- ================================
     HEADER
================================ -->
<div class="header">
  <a href="/" class="back-button">← Home</a>
  <div class="header-title">Pie AI</div>
  <div class="header-rule"></div>
</div>

<!-- ================================
     PROGRESS
================================ -->
<div class="progress-wrap">
  <div class="step active">
    <div class="step-dot">1</div>
    <span>Restaurant Info</span>
  </div>
  <div class="step-line"></div>
  <div class="step">
    <div class="step-dot">2</div>
    <span>Menus & Account</span>
  </div>
</div>

<!-- ================================
     PAGE SHELL
================================ -->
<div class="page-shell">

  <div class="page-header">
    <div class="page-eyebrow">Step 1 of 2</div>
    <div class="page-title">Set Up Your Restaurant</div>
    <p class="page-sub">Tell us about your restaurant so customers know what to expect.</p>
  </div>

  <form id="setupForm" action="/restaurant-setup-2" method="GET">

    <!-- LOGO -->
    <div class="form-group">
      <label>Restaurant Logo</label>
      <div class="logo-upload" onclick="document.getElementById('logoInput').click()">
        <img id="logoPreview" alt="Logo preview">
        <p>Tap to upload logo</p>
        <small>Square image recommended</small>
      </div>
      <input type="file" id="logoInput" accept="image/*" style="display:none">
    </div>

    <!-- NAME -->
    <div class="form-group">
      <label>Restaurant Name</label>
      <input type="text" name="name" placeholder="e.g. Pier 290" required>
    </div>

    <!-- DESCRIPTION -->
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" placeholder="Tell customers what makes your restaurant special..."></textarea>
    </div>

    <!-- TAGS -->
    <div class="form-group">
      <label>Tags — select all that apply</label>
      <div class="tags-grid" id="tagsGrid">
        <button type="button" class="tag-btn" data-tag="Vegan Options">🌱 Vegan Options</button>
        <button type="button" class="tag-btn" data-tag="Gluten-Free">🌾 Gluten-Free</button>
        <button type="button" class="tag-btn" data-tag="Seafood">🐟 Seafood</button>
        <button type="button" class="tag-btn" data-tag="Family Friendly">👨‍👩‍👧 Family Friendly</button>
        <button type="button" class="tag-btn" data-tag="Steakhouse">🥩 Steakhouse</button>
        <button type="button" class="tag-btn" data-tag="Cocktails">🍹 Cocktails</button>
        <button type="button" class="tag-btn" data-tag="Desserts">🍰 Desserts</button>
        <button type="button" class="tag-btn" data-tag="Lakefront">🌊 Lakefront</button>
        <button type="button" class="tag-btn" data-tag="Outdoor Seating">🌿 Outdoor Seating</button>
        <button type="button" class="tag-btn" data-tag="Fine Dining">✨ Fine Dining</button>
      </div>
      <input type="hidden" name="tags" id="tagsInput">
    </div>

    <div class="section-divider"></div>
    <div class="section-label">Contact & Hours</div>

    <!-- HOURS -->
    <div class="form-group">
      <label>Hours of Operation</label>
      <input type="text" name="hours" placeholder="e.g. Mon–Thu 11am–9pm · Fri–Sat 11am–10pm">
    </div>

    <!-- WEBSITE -->
    <div class="form-group">
      <label>Website</label>
      <input type="url" name="website" placeholder="https://yourrestaurant.com">
    </div>

    <!-- PHONE -->
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" name="phone" placeholder="(262) 245-2100">
    </div>

    <!-- CONTINUE -->
    <button type="submit" class="continue-btn">Continue →</button>

  </form>

</div>

<!-- ================================
     SCRIPT
================================ -->
<script>

  // Logo preview
  document.getElementById('logoInput').onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const preview = document.getElementById('logoPreview');
      preview.src = ev.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  };

  // Tag toggle
  const selectedTags = new Set();

  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        btn.classList.remove('active');
      } else {
        selectedTags.add(tag);
        btn.classList.add('active');
      }
      document.getElementById('tagsInput').value = Array.from(selectedTags).join(',');
    });
  });

</script>

</body>
</html>
